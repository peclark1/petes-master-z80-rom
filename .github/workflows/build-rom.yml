name: Build ROM from Z80 source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Z80 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y z80asm

      - name: Stage reference images for diagnostics
        run: |
          mkdir -p build
          cp IMSAI_MONITOR_V5.6_TARGET_LOW_4K.BIN build/reference-low.bin
          cp IMSAI_MONITOR_V5.6_TARGET_HIGH_4K.BIN build/reference-high.bin

      - name: Assemble and verify ROM
        run: make verify

      - name: Upload ROM build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imsai-monitor-v56-rom
          include-hidden-files: true
          path: |
            build/*.BIN
            build/*.HEX
            build/*.bin
            build/.*-raw.bin
            build/SHA256SUMS.txt
            build/*.lst
            build/*.labels
            build/*.asm
          if-no-files-found: warn
